<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixelt</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Pixelt 画像変換</h1>

      <div class="row">
        <input id="input-path" readonly placeholder="入力ファイル..." />
        <button id="btn-input" type="button">参照</button>
      </div>

      <div class="row">
        <label for="format-select">形式</label>
        <select id="format-select">
          <option value="jpeg">JPEG (.jpg)</option>
          <option value="png">PNG (.png)</option>
          <option value="webp">WebP (.webp, ロスレス)</option>
          <option value="gif">GIF (.gif)</option>
          <option value="bmp">BMP (.bmp)</option>
          <option value="tiff">TIFF (.tiff)</option>
          <option value="qoi">QOI (.qoi)</option>
        </select>
      </div>

      <div class="row">
        <label for="quality">品質 (JPEG/PNG)</label>
        <input id="quality" type="range" min="1" max="100" value="85" />
        <span id="quality-value">85</span>
      </div>

      <div class="row">
        <input id="output-path" readonly placeholder="出力ファイル..." />
        <button id="btn-output" type="button">保存先</button>
      </div>

      <div class="row">
        <button id="btn-convert" type="button">変換</button>
      </div>

      <p id="result"></p>
    </main>
  </body>
</html>
